<title>Drivers: A Reflection on Gratitude</title>
<style>
/* ============================================================
   THEME TOKENS: change colors and type here.
   Category colors live in CONTENT.kinds below.
   ============================================================ */
:root{
  --paper:#f6f2ea; --paper-2:#eee7da; --card:#fcfaf5; --ink:#1f1c18; --ink-2:#433d35;
  --muted:#675f55; --rule:#d8cfbf; --rule-2:#c4b9a6; --accent:#a3461a; --focus:#1d5c96;
  --serif:"Iowan Old Style","Charter","Palatino Linotype","Book Antiqua",Georgia,Cambria,serif;
  --display:"Fraunces",var(--serif);
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --bar:52px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--serif);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:var(--paper);padding:8px 12px;font-family:var(--sans);font-size:14px}
.skip:focus{top:8px}

/* ---------- top bar ---------- */
.bar{position:fixed;inset:0 0 auto 0;height:var(--bar);z-index:40;display:flex;align-items:center;gap:16px;padding:0 16px;
  background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);font-family:var(--sans)}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap;min-width:0}
.brand b{font-family:var(--display);font-weight:600;font-size:19px}
.brand span{font-size:13px;color:var(--muted)}
.progress{display:flex;align-items:center;gap:6px;margin:0 auto}
.dot{width:22px;height:22px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center;border-radius:50%}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rule-2);transition:transform .2s,background .2s}
.dot.seen::before{background:var(--ink-2)}
.dot[aria-current="step"]::before{background:var(--accent);transform:scale(1.45)}
.count{font-size:12px;color:var(--muted);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.controls{display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:1px solid var(--rule);background:var(--card);border-radius:5px;
  font-family:var(--sans);font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--paper-2);border-color:var(--rule-2)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn svg{width:14px;height:14px;flex:none}
.btn.icon{padding:0 9px}
.linebar{position:fixed;left:0;top:calc(var(--bar) - 2px);height:2px;background:var(--accent);z-index:41;transition:width .5s ease}

/* ---------- editorial layout (reading) ---------- */
#app{display:grid;grid-template-columns:minmax(340px,34%) 1fr;padding-top:var(--bar)}
.steps{grid-column:1;grid-row:1;padding:0 0 45vh;position:relative;z-index:2}
.stage{grid-column:2;grid-row:1;position:sticky;top:var(--bar);height:calc(100vh - var(--bar));display:grid;grid-template-rows:1fr auto;min-width:0}
.stage-main{position:relative;min-height:0}
#viz{display:block;width:100%;height:100%}
.caption{display:none}

.intro{min-height:calc(100vh - var(--bar));display:flex;flex-direction:column;justify-content:center;padding:0 28px 0 clamp(20px,4.5vw,64px);max-width:540px}
.intro-title{font-family:var(--display);font-weight:600;font-size:clamp(46px,5vw,72px);margin:0;line-height:.95}
.intro-sub{font-size:22px;color:var(--muted);margin:10px 0 26px}
.intro-text{font-family:var(--sans);font-size:14px;line-height:1.55;color:var(--muted);margin:0;padding-top:14px;border-top:1px solid var(--rule);max-width:400px}
.intro-hint{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-top:28px}

.step{min-height:90vh;display:flex;align-items:center;padding:0 28px 0 clamp(20px,4.5vw,64px)}
.txt{max-width:430px;opacity:.28;transition:opacity .5s}
.step.active .txt{opacity:1}
.kicker{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
.headline{font-family:var(--serif);font-weight:400;font-size:clamp(25px,2.2vw,32px);line-height:1.2;margin:0 0 16px;letter-spacing:-.005em;text-wrap:balance}
.step[data-id="close"] .headline{font-family:var(--display);font-weight:600}
.body p{font-size:19px;line-height:1.6;color:var(--ink-2);margin:0 0 14px}
.body p:last-child{margin-bottom:0}
.body em{color:var(--ink)}
.fn{font-family:var(--sans);font-size:12.5px;line-height:1.5;color:var(--muted);margin-top:18px;padding-top:10px;border-top:1px solid var(--rule)}
.fn a{color:inherit}

/* ---------- SVG marks ---------- */
#viz text,.static-map text{font-family:var(--serif)}
.lbl{font-size:15px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;transition:opacity .5s}
.k-effort .lbl{font-weight:700}
.k-float .lbl{font-family:var(--sans);font-size:23px;font-weight:600;letter-spacing:.02em;fill:var(--ink-2)}
.inner{font-family:var(--display)!important;font-weight:600;font-size:16px;fill:var(--paper);pointer-events:none}
.link .base{fill:none;stroke:var(--ink);stroke-width:1.3}
.link[data-type="unknown"] .base{stroke-dasharray:3 5}
.link[data-type="soft"] .base{stroke:var(--accent);stroke-width:1.6}
.link[data-type="interact"] .base{stroke:#7a6f62;stroke-width:1.3}
.link[data-type="interact"].hi .base{stroke:var(--accent);stroke-width:1.8}
.link[data-type="interact"] .flow{display:none}
.link[data-type="path"] .base{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 6}
.link .flow{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1.5 17;opacity:0;transition:opacity .6s}
.link.flowing .flow{opacity:.65;animation:flow 3s linear infinite}
.link[data-type="unknown"] .flow{display:none}
@keyframes flow{to{stroke-dashoffset:-18.5}}
.k-float .lbl{animation:drift 10s ease-in-out infinite alternate}
.k-float:nth-child(2n) .lbl{animation-duration:13s;animation-delay:-4s}
.k-float:nth-child(3n) .lbl{animation-duration:11s;animation-delay:-7s}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(7px,-6px)}}
.glow{transform-box:fill-box;transform-origin:center;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
body.paused .flowing .flow,body.paused .k-float .lbl,body.paused .glow{animation-play-state:paused}
.annot .sans{font-family:var(--sans)}
.node{cursor:default}

/* ---------- presenter mode ---------- */
body.presenter{overflow:hidden}
body.presenter #app{grid-template-columns:1fr;height:100vh;padding-top:0}
body.presenter .steps{display:none}
body.presenter .stage{grid-column:1;position:relative;top:0;height:100vh;padding-top:14px}
body.presenter .caption{display:block;padding:4px 6vw 4.5vh;min-height:16vh}
.caption .kicker{font-size:clamp(12px,.9vw,15px);margin-bottom:8px}
.caption .headline{font-size:clamp(28px,2.7vw,50px);margin:0;max-width:34ch;line-height:1.16}
body.presenter .bar{opacity:0;transition:opacity .35s;background:var(--paper)}
body.presenter.ui .bar,body.presenter .bar:focus-within,body.presenter .bar:hover{opacity:1}
body.presenter .linebar{top:0;opacity:.6}
body.presenter .lbl{font-size:16px}
body.presenter .caption.cl .headline{font-family:var(--display);font-weight:600}

/* ---------- inline notes (fallback when pop-ups are blocked) ---------- */
.notes-inline{position:fixed;right:0;top:var(--bar);bottom:0;width:min(420px,90vw);z-index:45;background:var(--card);border-left:1px solid var(--rule-2);
  padding:16px 20px;overflow:auto;font-size:17px;line-height:1.55;box-shadow:-12px 0 30px -20px rgba(0,0,0,.4)}
.notes-inline .warn{font-family:var(--sans);font-size:12.5px;background:#fff4e5;border:1px solid #e9c793;border-radius:5px;padding:8px 10px;margin-bottom:12px}
.cue{font-family:var(--sans);font-size:13px;color:var(--muted);font-style:italic}

/* ---------- dialog ---------- */
dialog{border:1px solid var(--rule-2);border-radius:8px;background:var(--card);color:var(--ink);max-width:min(760px,92vw);max-height:86vh;padding:0;overflow:auto}
dialog::backdrop{background:rgba(31,28,24,.38)}
.dlg{padding:24px 28px}
.dlg h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0 0 4px}
.dlg h3{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:22px 0 8px}
.dlg ol{padding-left:20px;margin:0}
.dlg li{margin:0 0 12px;line-height:1.5;font-size:16px}
.dlg .note{display:block;font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:3px}
.dlg a{color:var(--focus)}
.dlg p{line-height:1.55}
.dlg kbd{font-family:var(--sans);font-size:12px;border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;background:#fff}
.dlg table{border-collapse:collapse;font-family:var(--sans);font-size:14px}
.dlg td{padding:4px 14px 4px 0;vertical-align:top}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

/* ---------- read / print ---------- */
#reader{display:none;max-width:700px;margin:0 auto;padding:calc(var(--bar) + 40px) 20px 80px}
body.reading #reader{display:block}
body.reading #app{display:none}
#reader h1{font-family:var(--display);font-weight:600;font-size:44px;margin:0}
#reader .sub{font-size:20px;color:var(--muted);margin:4px 0 36px}
#reader h2{font-family:var(--sans);font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin:34px 0 8px}
#reader p{font-size:18px;line-height:1.62;color:var(--ink-2);margin:0 0 12px}
#reader p.cue{display:none}
#reader figure{margin:22px 0;border:1px solid var(--rule);border-radius:6px;padding:10px;background:var(--card);break-inside:avoid}
#reader figcaption{font-family:var(--sans);font-size:13px;color:var(--muted);padding:6px 6px 2px}
#reader ol li{margin-bottom:10px;line-height:1.5}

@media (max-width:860px){
  #app{grid-template-columns:1fr}
  .stage{grid-column:1;grid-row:1;height:52vh;z-index:3;background:var(--paper);border-bottom:1px solid var(--rule)}
  .steps{grid-row:2}
  .intro{min-height:60vh}
  .step{min-height:70vh;padding:0 18px}
  .txt{background:color-mix(in srgb,var(--paper) 94%,transparent);padding:10px 0}
  .brand span,.btn .lbl-t,.progress,.count,#bNotes,#bPresent{display:none}
  .bar{gap:8px;padding:0 10px}.controls{margin-left:auto}
}
@media (max-width:1180px){ .btn .lbl-t{display:none} .btn{padding:0 9px} .brand span{display:none} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media print{
  .bar,.linebar,#app,dialog,.notes-inline,.skip{display:none!important}
  #reader{display:block!important;padding:0;max-width:none}
  body{background:#fff}
  #reader figure{background:#fff}
  a{color:inherit}
}
</style>
</head>

<script>
window.CONTENT = {
  title: "Drivers",
  subtitle: "A reflection on gratitude",
  targetMinutes: "5–7 min",
  intro: "A short reflection, first shared at a department meeting. Scroll, or use the → key, to move through it. Sources are listed under <b>Sources</b> in the top bar.",

  /* Beats 1–3: the work */
  outcomeLabels: ["LOS", "NPST", "CAUTI", "DTR", "Mortality", "Readmission", "Nursing Communications", "Margin"],

    { id: "teacher",  kind: "people",        label: "A teacher who saw something early" },

  /* Beat 4: headwinds and tailwinds */

<script>
/* ============================================================

(function(){

const K = window.CONTENT;

const reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');

const kind = id => K.kinds.find(k => k.id === id) || { id: 'unknown', name: '', color: '#1f1c18' };
const dur = ms => (reduceMQ.matches ? 0 : ms);

const stripTags = s => String(s).replace(/<[^>]+>/g, '');
/* control point for an interaction arc: gentle curves, bent away from the center when the chord would cross it */
function ixCtrl(a, b){
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, d = Math.hypot(mx - CX, my - CY);
  if (d >= 150) return { x: CX + (mx - CX) * .78, y: CY + (my - CY) * .78 };
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
  let px = -dy / len, py = dx / len;
  if ((mx - CX) * px + (my - CY) * py < 0){ px = -px; py = -py; }
  return { x: CX + px * 175, y: CY + py * 175 };
}

function wrap(str, max, maxLines){
  maxLines = maxLines || 3;
  const words = String(str).split(/\s+/).filter(Boolean), lines = [];
  let cur = '';
  for (const w of words){
    if (!cur) cur = w; else if ((cur + ' ' + w).length <= max) cur += ' ' + w; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines.slice(0, maxLines);
}

/* ------------------------------------------------------------
   Layout of the life drivers (fixed for the whole story)
   ------------------------------------------------------------ */
const LIFE = (function(){
  const self = K.drivers.filter(d => d.kind === 'self');
  const rest = K.drivers.filter(d => d.kind !== 'self');
  const out = [];

  self.forEach((d, i) => out.push(Object.assign({}, d, { ang: LENS_C + (i - (self.length - 1) / 2) * 15 })));
  // everything else, clockwise from the top of the lens around to its bottom
  const start = LENS_C + 24, span = 360 - 48;
  rest.forEach((d, i) => {
    const ang = start + (i + .5) * span / rest.length;
    // stagger only near the top and bottom, where neighbouring labels stack vertically
    out.push(Object.assign({}, d, { ang, f: (Math.abs(Math.cos(rad(ang))) < .5 && i % 2) ? 1.12 : 1 }));
  });
  out.forEach(d => {
    d.ang = ((d.ang % 360) + 360) % 360;
    const f = d.kind === 'self' ? .78 : (d.f || 1);
    d.x = CX + Math.cos(rad(d.ang)) * RX * f; d.y = CY + Math.sin(rad(d.ang)) * RY * f;
  });
  return out;
})();
const angDist = a => { const d = Math.abs(((a - LENS_C) % 360 + 540) % 360 - 180); return d; };
const MORE = (function(){
  // deterministic scatter of small points between the sector labels and the named drivers
  const pts = []; let s = 7;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < K.moreDots; i++){
    const a = LENS_C + 30 + rnd() * 300, f = .66 + rnd() * .2;
    pts.push({ x: CX + Math.cos(rad(a)) * RX * f, y: CY + Math.sin(rad(a)) * RY * f, a });
  }
  return pts;
})();

/* ------------------------------------------------------------
   Renderer
   ------------------------------------------------------------ */
function createRenderer(svgEl){
  const svg = d3.select(svgEl).attr('viewBox', `0 0 ${W} ${H}`);
  const uid = 'g' + Math.random().toString(36).slice(2, 7);
  const defs = svg.append('defs');
  const grad = defs.append('radialGradient').attr('id', uid + 'lens').attr('cx', 0).attr('cy', 0).attr('r', 1).attr('gradientUnits', 'objectBoundingBox')
    .attr('gradientTransform', 'translate(.5,.5) scale(.5)');
  grad.append('stop').attr('offset', '0%').attr('stop-color', '#e4b48f').attr('stop-opacity', .55);
  grad.append('stop').attr('offset', '70%').attr('stop-color', '#efd3b8').attr('stop-opacity', .35);
  grad.append('stop').attr('offset', '100%').attr('stop-color', '#f6f2ea').attr('stop-opacity', 0);
  const gLens = svg.append('g').attr('transform', `translate(${CX},${CY}) scale(1,${RY / RX})`);
  const lensPath = gLens.append('path').attr('fill', `url(#${uid}lens)`).attr('opacity', 0);
  lensPath.node()._a = [LENS_C, LENS_C];
  const lensArc = d3.arc().innerRadius(0).outerRadius(RX * 1.32);
  const gL = svg.append('g').attr('class', 'links');
  const gA0 = svg.append('g').attr('class', 'annot under');
  const gN = svg.append('g').attr('class', 'nodes');
  const gA = svg.append('g').attr('class', 'annot');

  function linkPath(a, b, type){
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    let qx = mx, qy = my;
    if (type === 'interact'){
      const q = ixCtrl(a, b); qx = q.x; qy = q.y;
    } else if (type === 'indirect' || type === 'soft'){
      const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1, k = Math.min(45, len * .22);
      qx = mx - dy / len * k; qy = my + dx / len * k;
    }
    return `M${a.x.toFixed(1)},${a.y.toFixed(1)} Q${qx.toFixed(1)},${qy.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}`;
  }
  function labelLayout(d){
    const lines = wrap(d.label || '', d.wrap || 17, 3), lh = 18, h = lines.length * lh, r = d.r || 0, gap = 9;
    let x = 0, y0, anchor = 'middle';
    switch (d.lpos){
      case 'right': x = r + gap; anchor = 'start'; y0 = -h / 2 + 13; break;
      case 'left': x = -(r + gap); anchor = 'end'; y0 = -h / 2 + 13; break;
      case 'top': y0 = -(r + gap) - h + 14; break;
      case 'center': y0 = -h / 2 + 14; break;
      default: y0 = r + gap + 13;
    }
    return { lines: lines.map((t, i) => ({ t, x, y: y0 + i * lh })), anchor };
  }
  function paintNode(g, d){
    const c = kind(d.kind).color;
    g.attr('class', `node k-${d.type}`);
    g.select('circle.halo').attr('fill', 'none').attr('stroke', c).attr('stroke-width', 1.5).attr('stroke-opacity', .5);
    const dot = g.select('circle.dot');
    if (d.type === 'outcome') dot.attr('fill', '#1f1c18').attr('stroke', 'none').attr('stroke-dasharray', null);
    else if (d.type === 'future') dot.attr('fill', '#fcfaf5').attr('stroke', '#a3461a').attr('stroke-width', 1.8).attr('stroke-dasharray', '5 4');
    else if (d.type === 'unknown') dot.attr('fill', '#f6f2ea').attr('stroke', '#1f1c18').attr('stroke-width', 1.5).attr('stroke-dasharray', '3 3');
    else if (d.type === 'ghost') dot.attr('fill', d.hi ? '#1f1c18' : (d.dashed ? '#f6f2ea' : '#8d8478')).attr('stroke', d.dashed ? '#675f55' : 'none').attr('stroke-width', 1.2).attr('stroke-dasharray', d.dashed ? '2 2' : null);
    else dot.attr('fill', c).attr('stroke', '#f6f2ea').attr('stroke-width', 2).attr('stroke-dasharray', null);
    g.select('title').text(d.label || '');
    const lab = g.select('text.lbl');
    const key = [d.label, d.lpos, d.r, d.wrap].join('|');
    if (lab.attr('data-k') !== key){
      lab.attr('data-k', key).selectAll('tspan').remove();
      if (d.type !== 'outcome' && d.type !== 'future'){
        const L = labelLayout(d);
        lab.attr('text-anchor', L.anchor);
        L.lines.forEach(l => lab.append('tspan').attr('x', l.x).attr('y', l.y).text(l.t));
      }
    }
    lab.style('opacity', d.hideLabel ? 0 : 1);
    const inner = g.select('text.inner');
    const hasInner = d.type === 'outcome' || d.type === 'future';
    inner.style('fill', d.type === 'future' ? '#a3461a' : null).style('font-size', d.type === 'future' ? '14px' : null);
    if (hasInner && inner.attr('data-k') !== d.label){
      inner.attr('data-k', d.label).selectAll('tspan').remove();
      const lines = wrap(d.label, d.type === 'future' ? 8 : 12, 4), lh = 19;
      lines.forEach((t, i) => inner.append('tspan').attr('x', 0).attr('y', (i - (lines.length - 1) / 2) * lh + 6).text(t));
      inner.attr('text-anchor', 'middle');
    }
    if (!hasInner){ inner.selectAll('tspan').remove(); inner.attr('data-k', null); }
  }

  function render(spec, ms){
    const T = ms == null ? 1000 : ms;
    const byId = new Map(spec.nodes.map(n => [n.id, n]));
    const origin = spec.origin;

    // lens
    const cur = lensPath.node()._a;
    const L = spec.lens || { a0: cur[0], a1: cur[1], op: 0 };
    const at = L.at || { x: CX, y: CY, s: 1 };
    gLens.transition().duration(dur(T * 1.2)).ease(d3.easeCubicInOut)

      .attrTween('d', function(){
        const el = this, s0 = el._a.slice(), i0 = d3.interpolateNumber(s0[0], L.a0), i1 = d3.interpolateNumber(s0[1], L.a1);
        return t => { const a0 = i0(t), a1 = i1(t); el._a = [a0, a1];
          return lensArc({ startAngle: rad(a0 + 90), endAngle: rad(a1 + 90) }); };
      });

    // links
    const links = (spec.links || []).filter(l => byId.has(l.s) && byId.has(l.t));
    const ls = gL.selectAll('g.link').data(links, d => d.id);
    const le = ls.enter().append('g').attr('class', 'link').attr('opacity', 0);
    le.append('path').attr('class', 'base'); le.append('path').attr('class', 'flow');
    le.each(function(d){ const o = (d.grow && byId.get(d.t)) || origin || byId.get(d.s); d3.select(this).selectAll('path').attr('d', linkPath(o, o, d.type)); });
    const la = le.merge(ls);
    la.attr('data-type', d => d.type).classed('flowing', !!spec.flow).classed('hi', d => !!d.hi);
    const lt = la.transition().duration(dur(T)).delay(d => dur(d.delay != null ? d.delay : (byId.get(d.s).delay || 0))).ease(d3.easeCubicInOut)
      .attr('opacity', d => d.op != null ? d.op : (byId.get(d.s).op == null ? 1 : byId.get(d.s).op) * .5);
    lt.selectAll('path').attr('d', function(){ const d = d3.select(this.parentNode).datum(); return linkPath(byId.get(d.s), byId.get(d.t), d.type); });
    ls.exit().transition().duration(dur(T * .9)).attr('opacity', 0).remove();

    // nodes
    const ns = gN.selectAll('g.node').data(spec.nodes, d => d.id);
    const ne = ns.enter().append('g').attr('opacity', 0)
      .attr('transform', d => { const o = d.from || origin || d; return `translate(${o.x},${o.y})`; });
    ne.append('title');
    ne.append('circle').attr('class', 'halo').attr('r', 0);
    ne.append('circle').attr('class', 'dot').attr('r', 0);
    ne.append('text').attr('class', 'lbl');
    ne.append('text').attr('class', 'inner');
    const na = ne.merge(ns);
    na.each(function(d){ paintNode(d3.select(this), d); });
    na.transition().duration(dur(T)).delay(d => dur(d.delay || 0)).ease(d3.easeCubicInOut)
      .attr('transform', d => `translate(${d.x},${d.y})`).attr('opacity', d => d.op == null ? 1 : d.op);
    na.select('circle.dot').transition().duration(dur(T)).delay(d => dur(d.delay || 0)).attr('r', d => d.r || 0);
    na.select('circle.halo').transition().duration(dur(T)).delay(d => dur(d.delay || 0)).attr('r', d => d.halo ? (d.r || 0) + 7 : 0);
    ns.exit().transition().duration(dur(T * .6)).attr('opacity', 0)
      .attr('transform', function(d){ const e = spec.exitTo; return e ? `translate(${e.x},${e.y})` : d3.select(this).attr('transform'); }).remove();

    // annotations (under = beneath nodes)
    [[gA0, spec.under], [gA, spec.annot]].forEach(([layer, list]) => {
      const as = layer.selectAll('g.a').data(list || [], d => d.id);
      const ae = as.enter().append('g').attr('class', 'a').attr('opacity', 0);
      ae.each(function(d){ d.build(d3.select(this)); });
      ae.merge(as).transition().duration(dur(T)).delay(d => dur(d.delay || 0)).attr('opacity', d => d.op == null ? 1 : d.op);
      as.exit().transition().duration(dur(T * .5)).attr('opacity', 0).remove();
    });
  }
  return { render };
}

   The states of the one graphic

function placeLabel(n, cx, cy){
  cx = cx == null ? CX : cx; cy = cy == null ? CY : cy;
  const a = Math.atan2(n.y - cy, n.x - cx), c = Math.cos(a), s = Math.sin(a);
  n.lpos = Math.abs(c) > .42 ? (c > 0 ? 'right' : 'left') : (s < 0 ? 'top' : 'bottom');
  if (n.lpos === 'top' || n.lpos === 'bottom') n.wrap = 13;
  return n;
}
function center(label, extra){ return Object.assign({ id: 'center', type: 'outcome', label, x: CX, y: CY, r: 62 }, extra || {}); }
function floats(collapsed){
  return K.outcomeLabels.map((t, i) => {
    const a = rad(-90 + i * 360 / K.outcomeLabels.length);
    return { id: 'f' + i, type: 'float', label: t, wrap: 40, lpos: 'center', r: 0,
      x: collapsed ? CX : CX + Math.cos(a) * 345, y: collapsed ? CY : CY + Math.sin(a) * 222,
      op: collapsed ? 0 : 1, delay: collapsed ? i * 35 : i * 60 };
  });
}
const GH = 22, HI = 'g11';
function ghosts(op, hiOnly){
  const nodes = [], links = [];
  for (let i = 0; i < GH; i++){
    const a = rad(i * 360 / GH + 8), f = .55 + .45 * (((i * 7) % 5) / 4), id = 'g' + i, hi = id === HI;
    nodes.push({ id, type: 'ghost', r: hi && hiOnly ? 7 : 5, dashed: i % 6 === 3, hi: hi && hiOnly, label: '',
      x: CX + Math.cos(a) * RX * f, y: CY + Math.sin(a) * RY * f, op: hiOnly ? (hi ? 1 : .1) : op, delay: hiOnly ? 0 : 300 + i * 35 });
    links.push({ id: 'gl' + i, s: id, t: 'center', type: i % 6 === 3 ? 'unknown' : 'direct', op: hiOnly ? (hi ? .9 : .04) : null });
  }
  [[1, 2], [6, 7], [14, 15], [18, 19]].forEach(([a, b], k) => links.push({ id: 'gi' + k, s: 'g' + a, t: 'g' + b, type: 'indirect', op: hiOnly ? .03 : null }));
  return { nodes, links };
}

/* Lenses: arcs in degrees (0 = right, clockwise). */
const LENS_NARROW = (function(){
  const lit = LIFE.filter(d => d.kind === 'self' || d.headwind).map(d => d.ang);
  return { a0: Math.min.apply(null, lit) - 10, a1: Math.max.apply(null, lit) + 10 };
})();
const LENS_HALF = { a0: Math.min(LENS_NARROW.a0, 88), a1: 272 };
const LENS_FULL = { a0: 0, a1: 360 };
const inLens = (ang, L) => (L.a1 - L.a0 >= 359.5) || ((((ang - L.a0) % 360) + 360) % 360) <= (L.a1 - L.a0) + .5;
const HOME = { x: CX, y: CY, s: 1 }, LEFT = { x: 385, y: CY, s: .8 };

function lifeNodes(L, opts){
  opts = opts || {};
  const T = opts.at || HOME;
  return LIFE.map(d => {
    const inside = inLens(d.ang, L);
    const x = T.x + (d.x - CX) * T.s, y = T.y + (d.y - CY) * T.s;
    const n = placeLabel({ id: 'd-' + d.id, type: d.kind === 'unknown' ? 'unknown' : (d.kind === 'self' ? 'effort' : 'driver'), kind: d.kind, label: d.label,
      x, y, r: d.kind === 'self' ? 11 : (d.kind === 'unknown' ? 10 : 8.5), halo: d.kind === 'self',
      op: (inside ? 1 : .13) * (opts.dim || 1), hideLabel: !inside || opts.hideLabels,
      delay: (opts.sweep && inside) ? 300 + angDist(d.ang) * 12 : 0, ang: d.ang }, T.x, T.y);
    if (d.kind === 'self') n.lpos = 'left';
    return n;
  });
}
function lifeLinks(nodes, scale){
  return nodes.map(n => ({ id: 'll-' + n.id, s: n.id, t: 'center', type: n.type === 'unknown' ? 'unknown' : 'direct', op: (n.op >= 1 ? .45 : .05) * (scale == null ? 1 : scale), delay: n.delay }));
}
function sectorLabels(T){
  T = T || HOME;
  return K.kinds.filter(k => k.id !== 'self').map(k => {
    const ds = LIFE.filter(d => d.kind === k.id); if (!ds.length) return null;
    let sx = 0, sy = 0; ds.forEach(d => { sx += Math.cos(rad(d.ang)); sy += Math.sin(rad(d.ang)); });
    const a = Math.atan2(sy, sx), x = T.x + Math.cos(a) * RX * .5 * T.s, y = T.y + Math.sin(a) * RY * .5 * T.s + 4;
    return { id: 'sec-' + k.id + (T === HOME ? '' : '-l'), delay: 900, build: g => g.append('text').attr('class', 'sans').attr('x', x).attr('y', y).attr('text-anchor', 'middle')
      .attr('font-size', 11).attr('font-weight', 600).attr('letter-spacing', '.14em').attr('fill', k.color)
      .attr('paint-order', 'stroke').attr('stroke', '#f6f2ea').attr('stroke-width', 4).text(k.name.toUpperCase()) };
  }).filter(Boolean);
}
function moreDots(T){
  T = T || HOME;
  return { id: 'more' + (T === HOME ? '' : '-l'), delay: 1100, build: g => MORE.forEach(p => g.append('circle')
    .attr('cx', T.x + (p.x - CX) * T.s).attr('cy', T.y + (p.y - CY) * T.s).attr('r', 2.2).attr('fill', '#8d8478').attr('opacity', .45)) };
}
function chartAnnot(key){ return { id: 'chart-' + key, delay: 350, build: g => buildChart(g, K.charts[key]) }; }

const STATES = {
  outcomes(){ return { nodes: floats(false), links: [] }; },
  converge(){

        .attr('fill', '#a3461a').attr('paint-order', 'stroke').attr('stroke', '#f6f2ea').attr('stroke-width', 5).text(p.label) };

    return { nodes: [center(K.lifeCenter)].concat(nodes), links: lifeLinks(nodes, .3).concat(arcs), lens: Object.assign({ op: .45 }, LENS_FULL), annot: labels };
  },

  },

function absentPhase(gone){

function buildChart(g, C){
  const X0 = 130, Y0 = 120, Wd = 740, PAD = 36;
  const rowH = C.type === 'forest' ? 70 : (C.type === 'dumbbell' ? 72 : 52), rowsTop = Y0 + 112, axisY = rowsTop + C.rows.length * rowH + 4;
  const capLines = wrap(C.caption, 92, 3), Hd = (axisY - Y0) + 62 + capLines.length * 20 + 18;
  g.append('rect').attr('x', X0).attr('y', Y0).attr('width', Wd).attr('height', Hd).attr('rx', 8).attr('fill', '#fcfaf5').attr('stroke', '#c4b9a6');
  g.append('text').attr('x', X0 + PAD).attr('y', Y0 + 46).attr('font-size', 22).attr('fill', '#1f1c18').text(C.title);
  g.append('text').attr('class', 'sans').attr('x', X0 + PAD).attr('y', Y0 + 72).attr('font-size', 13).attr('fill', '#675f55').text(C.subtitle);
  const xL = C.type === 'change' || C.type === 'dumbbell' ? 520 : 470, xR = X0 + Wd - PAD - 10;
  const x = d3.scaleLinear().domain(C.domain).range([xL, xR]);
  const accent = '#a3461a', ink = '#1f1c18', muted = '#675f55', rule = '#d8cfbf';
  // gridlines / benchmarks
  const ticks = C.ticks || (C.type === 'change' ? [-3, -2, -1, 0, 1, 2, 3] : [0, .2, .5, .8].concat(C.domain[1] > 1 ? [1.2] : [1.0]));
  ticks.forEach(t => {
    const zero = t === 0 && C.type !== 'dumbbell';
    g.append('line').attr('x1', x(t)).attr('x2', x(t)).attr('y1', rowsTop - 18).attr('y2', axisY).attr('stroke', zero ? '#433d35' : rule)
      .attr('stroke-width', zero ? 1.3 : 1).attr('stroke-dasharray', zero ? null : '2 4');
    g.append('text').attr('class', 'sans').attr('x', x(t)).attr('y', axisY + 20).attr('text-anchor', 'middle').attr('font-size', 12.5).attr('fill', '#433d35')
      .text(C.type === 'change' ? (t > 0 ? '+' + t : t) : (t === 0 ? '0' : t.toFixed(1)));
    if (C.type === 'dumbbell') {}
    const bm = { .2: 'small', .5: 'medium', .8: 'large' }[t];
    if (bm && C.type !== 'change' && C.type !== 'dumbbell') g.append('text').attr('x', x(t)).attr('y', axisY + 38).attr('text-anchor', 'middle').attr('font-size', 13).attr('font-style', 'italic').attr('fill', muted).text(bm);
  });
  if (C.type === 'change') g.append('text').attr('class', 'sans').attr('x', (xL + xR) / 2).attr('y', axisY + 38).attr('text-anchor', 'middle').attr('font-size', 12.5).attr('fill', muted).text('points of change');
  // rows
  C.rows.forEach((r, i) => {
    const cy = rowsTop + i * rowH + rowH / 2 - 8, col = r.strong || C.type === 'forest' ? accent : '#8d8478';
    const lab = g.append('text').attr('x', X0 + PAD).attr('y', cy + (r.sub ? -2 : 5)).attr('font-size', 15.5).attr('fill', ink).attr('font-weight', r.strong ? 700 : 400);
    wrap(r.label, C.type === 'change' || C.type === 'dumbbell' ? 30 : (C.type === 'forest' ? 40 : 34), 2).forEach((t, k) => lab.append('tspan').attr('x', X0 + PAD).attr('dy', k ? 19 : 0).text(t));
    if (r.sub) g.append('text').attr('class', 'sans').attr('x', X0 + PAD).attr('y', cy + 18).attr('font-size', 12).attr('fill', muted).text(r.sub);
    if (C.type === 'dumbbell'){
      const xp = x(r.p), xa = x(r.a), dir = xa > xp ? 1 : -1;
      g.append('line').attr('x1', xp + dir * 9).attr('x2', xa - dir * 12).attr('y1', cy).attr('y2', cy).attr('stroke', col).attr('stroke-width', 2.5);
      g.append('path').attr('d', `M${xa - dir * 12},${cy - 6} L${xa - dir * 3},${cy} L${xa - dir * 12},${cy + 6} Z`).attr('fill', col);
      g.append('circle').attr('cx', xp).attr('cy', cy).attr('r', 7).attr('fill', '#fcfaf5').attr('stroke', col).attr('stroke-width', 2);
      g.append('circle').attr('cx', xa).attr('cy', cy).attr('r', 8).attr('fill', col).attr('stroke', '#fcfaf5').attr('stroke-width', 2);
      g.append('text').attr('class', 'sans').attr('x', xp).attr('y', cy + 27).attr('text-anchor', 'middle').attr('font-size', 12.5).attr('fill', '#675f55').text('expected ' + r.p.toFixed(2));
      g.append('text').attr('class', 'sans').attr('x', xa).attr('y', cy - 15).attr('text-anchor', 'middle').attr('font-size', 13.5).attr('font-weight', 700).attr('fill', col).text('felt ' + r.a.toFixed(2));
    } else if (C.type === 'change'){
      const x0 = x(0), x1 = x(r.v);
      g.append('rect').attr('x', Math.min(x0, x1)).attr('y', cy - 11).attr('width', Math.abs(x1 - x0)).attr('height', 22).attr('fill', col).attr('opacity', r.strong ? 1 : .75);
      g.append('text').attr('class', 'sans').attr('x', r.v >= 0 ? x1 + 8 : x1 - 8).attr('y', cy + 5).attr('text-anchor', r.v >= 0 ? 'start' : 'end')
        .attr('font-size', 14).attr('font-weight', 700).attr('fill', col).text((r.v > 0 ? '+' : '−') + Math.abs(r.v).toFixed(2));
    } else {
      if (r.lo != null){
        g.append('line').attr('x1', x(r.lo)).attr('x2', x(r.hi)).attr('y1', cy).attr('y2', cy).attr('stroke', col).attr('stroke-width', 3.5).attr('stroke-linecap', 'round');
        [r.lo, r.hi].forEach(v => g.append('line').attr('x1', x(v)).attr('x2', x(v)).attr('y1', cy - 8).attr('y2', cy + 8).attr('stroke', col).attr('stroke-width', 2));
      } else {
        g.append('line').attr('x1', x(0)).attr('x2', x(r.v)).attr('y1', cy).attr('y2', cy).attr('stroke', col).attr('stroke-width', 1.5).attr('opacity', .6);
      }
      g.append('circle').attr('cx', x(r.v)).attr('cy', cy).attr('r', r.strong || r.lo != null ? 7.5 : 6).attr('fill', col).attr('stroke', '#fcfaf5').attr('stroke-width', 2);
      g.append('text').attr('class', 'sans').attr('x', x(r.v)).attr('y', cy - 14).attr('text-anchor', 'middle').attr('font-size', 13.5).attr('font-weight', 700).attr('fill', col)
        .text(r.v.toFixed(2) + (r.lo != null ? `  [${r.lo.toFixed(2)}, ${r.hi.toFixed(2)}]` : ''));
    }
  });
  const cap = g.append('text').attr('x', X0 + PAD).attr('y', axisY + 66).attr('font-size', 14).attr('fill', '#433d35');
  capLines.forEach((t, i) => cap.append('tspan').attr('x', X0 + PAD).attr('dy', i ? 20 : 0).text(t));
}

/* ------------------------------------------------------------
   DOM
   ------------------------------------------------------------ */
const stepsEl = $('#steps');
function buildSteps(){
  const intro = document.createElement('div');
  intro.className = 'intro';
  intro.innerHTML = `<h1 class="intro-title">${esc(K.title)}</h1><p class="intro-sub">${esc(K.subtitle)}</p><p class="intro-text">${K.intro}</p><p class="intro-hint">Scroll ↓</p>`;
  stepsEl.appendChild(intro);
  K.steps.forEach((st, i) => {
    const a = document.createElement('article');
    a.className = 'step'; a.dataset.i = i; a.dataset.id = st.id; a.id = 'step-' + st.id;
    a.innerHTML = `<div class="txt">${st.kicker ? `<p class="kicker">${st.kicker}</p>` : ''}<h2 class="headline">${st.headline}</h2>` +
      `<div class="body">${(st.body || []).map(p => `<p>${p}</p>`).join('')}</div>${st.fn ? `<p class="fn">${st.fn}</p>` : ''}</div>`;
    stepsEl.appendChild(a);
  });
}
function buildProgress(){
  const p = $('#progress');
  K.steps.forEach((st, i) => {
    const b = document.createElement('button');
    b.className = 'dot'; b.type = 'button';
    b.setAttribute('aria-label', `Step ${i + 1}: ${st.label}`); b.title = `${i + 1}. ${st.label}`;
    b.addEventListener('click', () => goTo(i, true));
    p.appendChild(b);
  });
}
function buildSources(){
  const src = K.sources.map(s => `<li>${s.cite} <a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.url.replace('https://', '')}</a><span class="note">${s.note}</span></li>`).join('');
  $('#srcBody').innerHTML = `<div class="dlg-head"><h2 id="srcTitle">Sources and notes</h2><button class="btn" id="srcClose">Close</button></div>
    <h3>About this reflection</h3>${K.about.map(p => `<p>${p}</p>`).join('')}
    <h3>Sources</h3><ol>${src}</ol>
    <h3>Keyboard</h3><table>
      <tr><td><kbd>→</kbd> <kbd>PgDn</kbd> <kbd>Space</kbd></td><td>Next (clickers send PgDn)</td></tr>
      <tr><td><kbd>←</kbd> <kbd>PgUp</kbd></td><td>Previous</td></tr>
      <tr><td><kbd>P</kbd></td><td>Presenter mode</td></tr><tr><td><kbd>N</kbd></td><td>Speaker notes window</td></tr>
      <tr><td><kbd>F</kbd></td><td>Full screen</td></tr><tr><td><kbd>M</kbd></td><td>Pause / resume motion</td></tr>
      <tr><td><kbd>R</kbd></td><td>Read / print version</td></tr><tr><td><kbd>Home</kbd></td><td>Back to the start</td></tr></table>`;
  $('#srcClose').addEventListener('click', () => $('#dlgSources').close());
}

/* ------------------------------------------------------------
   Navigation
   ------------------------------------------------------------ */
let viz;
let thenT;
function setVisual(ms){
  const st = K.steps[S.step], at = S.step;
  clearTimeout(thenT);
  const spec = STATES[st.visual]();
  viz.render(spec, ms);
  if (spec.then) thenT = setTimeout(() => { if (S.step === at) viz.render(STATES[spec.then](), 1600); }, reduceMQ.matches ? 0 : (spec.thenAfter || 2200));
  $('#vizDesc').textContent = st.sr;
}
function updateChrome(){
  const st = K.steps[S.step];
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('seen', S.seen.has(i));
    if (i === S.step) d.setAttribute('aria-current', 'step'); else d.removeAttribute('aria-current');
  });
  document.querySelectorAll('.step').forEach((el, i) => el.classList.toggle('active', i === S.step));
  $('#count').textContent = `${S.step + 1} / ${N}`;
  $('#linebar').style.width = ((S.step + 1) / N * 100) + '%';
  const cap = $('#caption');
  cap.classList.toggle('cl', !!st.closing);
  cap.innerHTML = (st.kicker ? `<p class="kicker">${st.kicker}</p>` : '') + `<p class="headline">${st.headline}</p>`;
  updateNotes();
}
function goTo(i, scroll){
  i = Math.max(0, Math.min(N - 1, i));
  const changed = i !== S.step || !S.init;
  S.step = i; S.seen.add(i);
  if (changed){ setVisual(); S.init = true; }
  updateChrome();
  if (changed) announce(`Step ${i + 1} of ${N}. ${stripTags(K.steps[i].headline)} ${K.steps[i].sr}`);
  if (scroll && !S.presenter && !document.body.classList.contains('reading')){
    S.lockUntil = Date.now() + 1100;
    document.getElementById('step-' + K.steps[i].id).scrollIntoView({ block: 'center', behavior: reduceMQ.matches ? 'auto' : 'smooth' });
  }
}
const next = () => goTo(S.step + 1, true);
const prev = () => goTo(S.step - 1, true);
function announce(t){ const l = $('#live'); l.textContent = ''; setTimeout(() => { l.textContent = t; }, 30); }
function observeSteps(){
  const io = new IntersectionObserver(entries => {
    if (S.presenter || Date.now() < S.lockUntil) return;
    entries.forEach(e => { if (e.isIntersecting) goTo(+e.target.dataset.i, false); });
  }, { rootMargin: '-48% 0px -48% 0px', threshold: 0 });
  document.querySelectorAll('.step').forEach(s => io.observe(s));
  let t;
  window.addEventListener('scroll', () => {
    clearTimeout(t);
    const sync = () => {
      if (S.presenter) return;
      if (Date.now() < S.lockUntil){ t = setTimeout(sync, S.lockUntil - Date.now() + 50); return; }
      const mid = window.innerHeight / 2; let best = null, bd = 1e9;
      document.querySelectorAll('.step').forEach(s => { const r = s.getBoundingClientRect(), d = Math.abs((r.top + r.bottom) / 2 - mid); if (d < bd){ bd = d; best = s; } });
      if (best && bd < window.innerHeight * .6 && +best.dataset.i !== S.step) goTo(+best.dataset.i, false);
    };
    t = setTimeout(sync, 160);
  }, { passive: true });
}

/* ---------- modes ---------- */
function setPresenter(on){
  S.presenter = on;
  document.body.classList.toggle('presenter', on);
  $('#bPresent').setAttribute('aria-pressed', String(on));
  if (on){ toggleReader(false); if (!S.t0) S.t0 = Date.now(); window.scrollTo(0, 0); }
  else { S.lockUntil = Date.now() + 600; const el = document.getElementById('step-' + K.steps[S.step].id); el && el.scrollIntoView({ block: 'center' }); }
  updateChrome();
  announce(on ? 'Presenter mode on. Use the arrow keys or a clicker.' : 'Presenter mode off.');
}
function setPaused(p){ S.paused = p; document.body.classList.toggle('paused', p); }
function toggleReader(force){
  const on = force == null ? !document.body.classList.contains('reading') : force;
  document.body.classList.toggle('reading', on);
  $('#bRead').setAttribute('aria-pressed', String(on));
  if (on){ if (S.presenter) setPresenter(false); window.scrollTo(0, 0); $('#reader').focus(); }
  else if (force == null) goTo(S.step, true);
}
function openSources(){ const d = $('#dlgSources'); if (d.showModal) d.showModal(); else d.setAttribute('open', ''); }
function fullscreen(){
  if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  else if (document.exitFullscreen) document.exitFullscreen();
}

/* ---------- speaker notes window (kept off the shared screen) ---------- */
function notesHTML(i){
  return (K.steps[i].notes || []).map(p => /^\(.*\)$/.test(p.trim()) ? `<p class="cue">${esc(p)}</p>` : `<p>${esc(p)}</p>`).join('');
}
function openNotes(){
  if (S.notesWin && !S.notesWin.closed){ S.notesWin.focus(); return; }
  let w = null;
  try { w = window.open('', 'driversSpeakerNotes', 'popup=yes,width=760,height=860'); } catch(e){ w = null; }
  if (!w){ $('#notesInline').hidden = false; updateNotes(); return; }
  S.notesWin = w; if (!S.t0) S.t0 = Date.now();
  const d = w.document;
  d.open();
  d.write(`<!doctype html><html><head><meta charset="utf-8"><title>Speaker notes · ${esc(K.title)}</title><style>
    body{margin:0;font-family:Georgia,Cambria,serif;background:#fcfaf5;color:#1f1c18}
    header{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:10px 16px;background:#1f1c18;color:#f6f2ea;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
    header b{font-size:16px} header .sp{flex:1} button{font:inherit;padding:6px 14px;border-radius:5px;border:1px solid #6b6258;background:#2d2924;color:#f6f2ea;cursor:pointer}
    #timer{font-variant-numeric:tabular-nums;font-size:18px}
    main{padding:20px 26px 60px;max-width:820px}
    .lab{font-family:'Segoe UI',system-ui,sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#a3461a;margin:0 0 6px}
    h1{font-size:20px;font-weight:400;margin:0 0 16px;color:#433d35}
    #notes p{font-size:25px;line-height:1.5;margin:0 0 16px}
    #notes p.cue{font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;color:#675f55;font-style:italic}
    #next{margin-top:26px;padding-top:14px;border-top:1px solid #d8cfbf;color:#675f55;font-size:17px}
  </style></head><body><header><b id="pos"></b><span id="lab"></span><span class="sp"></span><span id="timer">0:00</span>
  <button id="rst">Reset</button><button id="pv">← Prev</button><button id="nx">Next →</button></header>
  <main><p class="lab">Say</p><h1 id="head"></h1><div id="notes"></div><div id="next"></div></main></body></html>`);
  d.close();
  d.getElementById('pv').onclick = prev; d.getElementById('nx').onclick = next;
  d.getElementById('rst').onclick = () => { S.t0 = Date.now(); tick(); };
  d.addEventListener('keydown', handleKey);
  updateNotes();
}
function updateNotes(){
  const st = K.steps[S.step], nx = K.steps[S.step + 1], w = S.notesWin;
  if (w && !w.closed){
    const d = w.document;
    d.getElementById('pos').textContent = `${S.step + 1} / ${N}`;
    d.getElementById('lab').textContent = st.label;
    d.getElementById('head').textContent = 'On screen: ' + stripTags(st.headline);
    d.getElementById('notes').innerHTML = notesHTML(S.step);
    d.getElementById('next').textContent = nx ? 'Next: ' + stripTags(nx.headline) : 'End.';
  }
  const il = $('#notesInline');
  if (!il.hidden){
    il.innerHTML = `<div class="warn">Pop-ups are blocked, so notes are shown here. This panel is visible if you share this window.</div>
      <p class="kicker">${S.step + 1} / ${N} · ${esc(st.label)}</p>${notesHTML(S.step)}<p class="cue">${nx ? 'Next: ' + esc(stripTags(nx.headline)) : 'End.'}</p>
      <button class="btn" id="ilClose">Hide notes</button>`;
    $('#ilClose').onclick = () => { il.hidden = true; };
  }
}
function tick(){
  const w = S.notesWin;
  if (w && !w.closed && S.t0){
    const s = Math.floor((Date.now() - S.t0) / 1000), el = w.document.getElementById('timer');
    if (el) el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}  · target ${K.targetMinutes}`;
  }
}
setInterval(tick, 1000);

function handleKey(e){
  const t = e.target;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if ($('#dlgSources').open && e.key !== 'Escape') return;
  const onButton = t && t.closest && t.closest('button,a,summary');
  switch (e.key){
    case 'ArrowRight': case 'PageDown': e.preventDefault(); next(); break;
    case 'ArrowLeft': case 'PageUp': e.preventDefault(); prev(); break;
    case ' ': if (S.presenter && !onButton){ e.preventDefault(); e.shiftKey ? prev() : next(); } break;
    case 'Home': e.preventDefault(); if (!S.presenter) window.scrollTo({ top: 0 }); goTo(0, S.presenter); break;
    case 'End': e.preventDefault(); goTo(N - 1, true); break;
    case 'p': case 'P': setPresenter(!S.presenter); break;
    case 'n': case 'N': openNotes(); break;
    case 'm': case 'M': setPaused(!S.paused); break;
    case 'f': case 'F': fullscreen(); break;
    case 's': case 'S': openSources(); break;
    case 'r': case 'R': toggleReader(); break;
    case 'Escape': if (document.body.classList.contains('reading')) toggleReader(false); break;
  }
}

/* ---------- read / print version ---------- */
function buildReader(){
  const r = $('#reader'); r.tabIndex = -1;
  let h = `<h1>${esc(K.title)}</h1><p class="sub">${esc(K.subtitle)}</p>`;
  K.steps.forEach((st, i) => {
    h += `<h2>${esc(st.label)}</h2>` + notesHTML(i);
    if (st.id === 'narrow') h += `<figure><svg class="static-map" id="stNarrow" role="img" aria-label="${esc(st.sr)}"></svg><figcaption>The narrow lens: two personal drivers lit; the rest unseen.</figcaption></figure>`;
    if (st.id === 'why') h += `<figure><svg class="static-chart" data-chart="attribution" role="img" aria-label="${esc(st.sr)}"></svg></figure>`;
    if (st.id === 'absent') h += `<figure><svg class="static-chart" data-chart="removal" role="img" aria-label="${esc(st.sr)}"></svg></figure>`;
    if (st.id === 'evidence') h += `<figure><svg class="static-chart" data-chart="effects" role="img" aria-label="${esc(st.sr)}"></svg></figure>`;
    if (st.id === 'lookback') h += `<figure><svg class="static-chart" data-chart="hope" role="img" aria-label="${esc(st.sr)}"></svg></figure>`;
    if (st.id === 'all') h += `<figure><svg class="static-map" id="stAll" role="img" aria-label="${esc(st.sr)}"></svg><figcaption>The widened lens. Illustrative only: no causal effects or weights are implied.</figcaption></figure>`;
  });
  h += `<h2>About this reflection</h2>${K.about.map(p => `<p>${p}</p>`).join('')}`;
  h += `<h2>Sources</h2><ol>${K.sources.map(s => `<li>${s.cite} ${s.url}</li>`).join('')}</ol>`;
  r.innerHTML = h;
  createRenderer($('#stNarrow')).render(STATES.narrow(), 0);
  createRenderer($('#stAll')).render(STATES.all(), 0);
  r.querySelectorAll('.static-chart').forEach(el => {
    createRenderer(el).render({ nodes: [], links: [], annot: [chartAnnot(el.dataset.chart)] }, 0);
    const box = el.querySelector('.annot rect').getBBox();
    el.setAttribute('viewBox', `${box.x - 4} ${box.y - 4} ${box.width + 8} ${box.height + 8}`);
    el.style.width = '100%'; el.style.height = 'auto'; el.style.display = 'block';
  });
  r.querySelectorAll('.static-map').forEach(s => { s.setAttribute('viewBox', '0 60 1000 560'); s.style.width = '100%'; s.style.height = 'auto'; s.style.display = 'block'; });
}

/* ---------- init ---------- */
function init(){
  document.title = `${K.title}: ${K.subtitle}`;
  $('#brandTitle').textContent = K.title; $('#brandSub').textContent = K.subtitle;
  buildSteps(); buildProgress(); buildSources();
  viz = createRenderer($('#viz'));
  buildReader();
  $('#bPrev').onclick = prev; $('#bNext').onclick = next;
  $('#bPresent').onclick = () => setPresenter(!S.presenter);
  $('#bNotes').onclick = openNotes;
  $('#bSources').onclick = openSources;
  $('#bRead').onclick = () => toggleReader();
  document.addEventListener('keydown', handleKey);
  let uiT;
  document.addEventListener('mousemove', () => {
    if (!S.presenter) return;
    document.body.classList.add('ui'); clearTimeout(uiT);
    uiT = setTimeout(() => document.body.classList.remove('ui'), 2200);
  });
  if (reduceMQ.addEventListener) reduceMQ.addEventListener('change', () => setPaused(reduceMQ.matches));
  setPaused(S.paused);
  goTo(0, false);
  observeSteps();
  if (/present/i.test(location.hash)) setPresenter(true);
  window.addEventListener('beforeunload', () => { if (S.notesWin && !S.notesWin.closed) S.notesWin.close(); });
}
init();
})();
</script>
